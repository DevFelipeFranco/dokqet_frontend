<div class="flex flex-col items-center justify-center p-8 text-center rounded-xl border border-dashed border-border/70 bg-card/50">
  <div class="flex size-12 items-center justify-center rounded-full bg-muted text-muted-foreground mb-3">
    <ng-content select="[icon]">
      <svg class="size-6 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
      </svg>
    </ng-content>
  </div>

  <h3 class="text-sm font-semibold text-foreground">{{ title() }}</h3>
  
  @if (description()) {
    <p class="mt-1 text-sm text-muted-foreground max-w-sm">{{ description() }}</p>
  }

  @if (actionLabel()) {
    <div class="mt-4">
      <app-button variant="outline" size="sm" (buttonClick)="actionClick.emit()">
        {{ actionLabel() }}
      </app-button>
    </div>
  }

  <ng-content select="[custom-action]"></ng-content>
</div>
