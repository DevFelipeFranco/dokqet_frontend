<div class="floating-group" [ngClass]="className">
  <div class="floating-field-container">
    @if (hasPrefix) {
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-muted-foreground z-10">
        <ng-content select="[prefix]" />
      </div>
    }

    <ng-content />

    @if (label) {
      <label 
        [for]="id" 
        class="floating-label"
        [class.notch-bg-background]="notchBg === 'background'">
        {{ label }}
      </label>
    }

    @if (hasSuffix) {
      <div class="absolute inset-y-0 right-0 flex items-center pr-3 z-10">
        <ng-content select="[suffix]" />
      </div>
    }
  </div>

  @if (error) {
    <p class="floating-error" role="alert">
      <svg class="size-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ error }}</span>
    </p>
  } @else if (hint) {
    <p class="floating-hint">
      {{ hint }}
    </p>
  }
</div>
