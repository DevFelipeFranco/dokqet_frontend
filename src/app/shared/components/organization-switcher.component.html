<app-dropdown align="left" [fullWidth]="true">
  @if (compact()) {
    <button
      dropdown-trigger
      type="button"
      [title]="orgStore.activeOrg()?.name || 'Espacio Personal'"
      aria-label="Cambiar organización activa"
      class="mx-auto flex size-10 items-center justify-center rounded-xl border border-border bg-card text-foreground shadow-2xs hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors cursor-pointer">
      <span class="flex size-7 items-center justify-center rounded-full bg-primary text-primary-foreground text-[11px] font-bold select-none">
        {{ activeInitials() }}
      </span>
    </button>
  } @else {
    <button
      dropdown-trigger
      type="button"
      aria-label="Cambiar organización activa"
      class="w-full flex items-center justify-between gap-2.5 rounded-xl border border-border bg-card px-3 py-2 text-left text-sm font-medium text-foreground shadow-2xs hover:bg-muted/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors select-none cursor-pointer">
      <div class="flex min-w-0 items-center gap-2.5">
        <span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-primary text-primary-foreground text-xs font-bold shadow-2xs">
          {{ activeInitials() }}
        </span>
        <div class="flex min-w-0 flex-col">
          <span class="truncate text-xs sm:text-sm font-semibold text-foreground leading-tight">
            {{ orgStore.activeOrg()?.name || 'Espacio Personal' }}
          </span>
          @if (orgStore.activeOrg(); as active) {
            <span class="truncate text-[11px] font-normal text-muted-foreground leading-tight">
              {{ isPersonal(active) ? 'Organización personal' : (active.role === 'ADMIN' ? 'Firma · Administrador' : 'Firma · Abogado') }}
            </span>
          } @else {
            <span class="truncate text-[11px] font-normal text-muted-foreground leading-tight">
              Organización activa
            </span>
          }
        </div>
      </div>
      <svg class="size-4 shrink-0 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
      </svg>
    </button>
  }

  <div dropdown-content class="w-64 flex flex-col py-1">
    <div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">
      Espacios de trabajo
    </div>

    @for (org of orgStore.organizations(); track org.id) {
      <button
        type="button"
        (click)="selectOrg(org.id)"
        class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-left hover:bg-muted rounded-lg transition-colors cursor-pointer">
        <svg 
          [class]="'size-4 shrink-0 ' + (org.id === orgStore.activeOrg()?.id ? 'opacity-100 text-brand' : 'opacity-0')" 
          fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        <span class="flex-1 truncate font-medium text-foreground">{{ org.name }}</span>
        <span class="text-[11px] text-muted-foreground shrink-0">{{ isPersonal(org) ? 'Personal' : (org.role || 'Miembro') }}</span>
      </button>
    }

    <div class="my-1 border-t border-border"></div>

    @if (orgStore.activeOrg(); as active) {
      @if (!isPersonal(active)) {
        <a 
          routerLink="/organizacion"
          class="flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted rounded-lg transition-colors">
          <svg class="size-4 shrink-0 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="truncate">{{ active.role === 'ADMIN' ? 'Administrar ' + active.name : 'Ver organización' }}</span>
        </a>
      }
    }

    <a 
      routerLink="/organizaciones/nueva"
      class="flex items-center gap-2.5 px-3 py-2 text-sm text-foreground hover:bg-muted rounded-lg transition-colors">
      <svg class="size-4 shrink-0 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Crear firma jurídica</span>
    </a>
  </div>
</app-dropdown>
